[package]
name = "rust-dashboard"
version = "0.1.0"
edition = "2021"
description = "A cyberpunk-themed dashboard with Rust backend and React frontend"

[dependencies]
axum = { version = "0.7", features = ["macros", "form"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "cors", "normalize-path", "trace"] }
tower = { version = "0.4", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
